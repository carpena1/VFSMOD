name: Build VFSMOD
description: >-
  Install gfortran, build the vfsm and uh binaries into build/ (static release),
  and run tests. Shared by Build and Release.

inputs:
  gfortran:
    description: gfortran major version to install
    required: false
    default: "13"

runs:
  using: composite
  steps:
    - name: Install gfortran (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y gfortran-${{ inputs.gfortran }}
        sudo update-alternatives --install /usr/bin/gfortran gfortran \
          /usr/bin/gfortran-${{ inputs.gfortran }} 100

    - name: Install gfortran (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install gcc@${{ inputs.gfortran }}
        mkdir -p "$HOME/bin"
        ln -sf "$(brew --prefix gcc@${{ inputs.gfortran }})/bin/gfortran-${{ inputs.gfortran }}" \
          "$HOME/bin/gfortran"
        echo "$HOME/bin" >> "$GITHUB_PATH"

    - name: Install gfortran (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc-fortran
          make
          zip

    - name: Build (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        sh ./setup release
        mkdir -p build
        cp src_vfsm/vfsm src_uh/uh build/

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        sh ./setup release
        mkdir -p build
        cp src_vfsm/vfsm.exe src_uh/uh.exe build/

    # Fail the build when a binary needs the gfortran runtime (dynamic link) or
    # when its CPU type does not match the runner (so the package name is right).
    - name: Check binaries are static and match the platform (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   want='ELF 64-bit.*x86-64' ;;
          macOS-ARM64) want='Mach-O 64-bit.*arm64' ;;
          macOS-X64)   want='Mach-O 64-bit.*x86_64' ;;
          *) echo "::error::no check defined for runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
        esac
        fail=0
        for b in build/vfsm build/uh; do
          file "$b"
          file "$b" | grep -Eq "$want" || { echo "::error::$b is not $want"; fail=1; }
          if [ "${{ runner.os }}" = Linux ]; then
            file "$b" | grep -Eq 'statically linked|static-pie linked' \
              || { echo "::error::$b is not statically linked"; ldd "$b" || true; fail=1; }
          else
            otool -L "$b"
            if otool -L "$b" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)'; then
              echo "::error::$b links a library that is not part of macOS"; fail=1
            fi
          fi
        done
        exit $fail

    - name: Check binaries are static and match the platform (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        fail=0
        for b in build/vfsm.exe build/uh.exe; do
          objdump -f "$b" | grep -q 'pei-x86-64' \
            || { echo "::error::$b is not a Windows x86-64 binary"; fail=1; }
          dlls=$(objdump -p "$b" | sed -n 's/^[[:space:]]*DLL Name: //p')
          echo "$b needs: $(echo $dlls)"
          if echo "$dlls" | grep -iE 'libgfortran|libgcc|libquadmath|libwinpthread|libstdc'; then
            echo "::error::$b needs a MinGW runtime DLL"; fail=1
          fi
        done
        exit $fail

    - name: Regression check tests (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        PATH="$PWD/build:$PATH" sh check_vfsm.sh
        PATH="$PWD/build:$PATH" sh check_uh.sh
